build:
  system: docker
dockerfile_path: "./Dockerfile"
start_command: "/usr/local/bin/proxy"
scaling:
  trigger: http_requests
  min_cpu: 0.1
  max_cpu: 0.5
  min_memory: 128
  max_memory: 256
  min_replicas: 1
  max_replicas: 1
health_check:
  type: http
  http_path: "/health"
  interval_in_seconds: 30
